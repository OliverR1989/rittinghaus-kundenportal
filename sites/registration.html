<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prophete Werkstatt - Konto erstellen</title>
    <link href="../styles/style-registration.css" rel="stylesheet">
    <link href="../styles/typography.css" rel="stylesheet">
    <script src="../script.js"></script>
</head>

<body>
    <header>
        <div class="header-wrapper">
            <a href="../index.html">Zur Anmeldung</a>
        </div>
    </header>
    <main>
        <div class="main-wrapper">
            <div class="main-headline">
                <p>Konto erstellen</p>
                <p>Mit Ihrem Konto registrieren Sie Ihre Fahrzeuge und beantragen Ihre Kundenkarte.</p>
            </div>
        </div>
        <form>
            <p>Persönliche Daten</p>
            <label for="text">Vorname</label>
            <input type="text" id="name" name="name">
            <label for="text">Nachname</label>
            <input type="text" id="surname" name="text">
            <label for="text">Straße</label>
            <input type="text" id="street" name="name">
            <label for="text">Nummer</label>
            <input type="text" id="street-number" name="text">
            <label for="text">PLZ</label>
            <input type="text" id="postcode" name="name">
            <label for="text">Ort</label>
            <input type="text" id="city" name="text">
            <label for="text">E-Mail</label>
            <input type="text" id="email" name="name">
            <label for="text">Passwort</label>
            <input type="text" id="password-1" name="text">
            <label for="text">Passwort wiederholen</label>
            <input type="text" id="password-2" name="name">
            <div class="datenschutz">
                <div class="checkbox">
                </div>
                <p>Ich habe die <a href="#">Datenschutzerklärung</a> gelesen und bin mit der Speicherung meiner Daten einverstanden</p>
            </div>
            <button>Konto erstellen</button>
        </form>
    </main>
</body>

</html>
