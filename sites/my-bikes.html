<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prophete Werkstatt - Meine Fahrzeuge</title>
    <link href="../styles/style-my-bikes.css" rel="stylesheet">
    <link href="../styles/typography.css" rel="stylesheet">
    <script src="../script.js"></script>
</head>

<body>
    <header>
        <div class="header-wrapper">
            <p>Guten Tag,</p>
            <p>Max Mustermann</p>
        </div>
    </header>
    <main>
        <div class="main-wrapper">
            <section class="costumer-card">
                <img src="#" alt="card-logo">
                <div class="card-info">
                    <p>Kundenkarte</p>
                    <p>Noch nicht beantragt</p>
                </div>
            </section>
            <section class="my-bikes">
                <div class="my-bikes-headline">
                    <h2>Meine Fahrzeuge</h2>
                    <p>1 Fahrzeug</p>
                </div>
                <div class="my-bikes-list">
                    <div class="bike-card">
                        <div class="bike-card-headline">
                            <img src="#" alt="bike-img">
                            <div class="bike-card-headline-information">
                                <p>Bezeichnung</p>
                                <p>E-Bike</p>
                            </div>
                        </div>
                        <div class="bike-card-information">
                            <div class="articel-number">
                                <p>Artikelnummer</p>
                                <p>5xxxx-xxxx</p>
                            </div>
                            <div class="serial-number">
                                <p>Seriennummer</p>
                                <p>xxxxxxxxxxxx</p>
                            </div>
                            <div class="purchase-date">
                                <p>Kaufdatum</p>
                                <p>TT.MM.JJJJ</p>
                            </div>
                        </div>
                    </div>
                </div>
                <a class="button" href="./registration-bikes.html">+ Fahrzeug hinzufügen</a>
            </section>
        </div>
    </main>
    <footer>
        <div class="footer-wrapper">
            <div class="footer-box">
                <img src="#" alt="bike-logo">
                <p>Fahrzeuge</p>
            </div>
            <div class="footer-box">
                <img src="#" alt="card-logo">
                <p>Kundenkarte</p>
            </div>
            <div class="footer-box">
                <img src="#" alt="logout-logo">
                <p>Abmelden</p>
            </div>
        </div>
    </footer>

</body>

</html>
