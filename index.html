<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prophete Werkstatt - Kundenportal</title>
    <link href="style.css" rel="stylesheet">
    <link href="./styles/typography.css" rel="stylesheet">
    <script src="script.js"></script>
</head>

<body>
    <header>
        <div class="header-wrapper">
            <img src="#" alt="logo">
            <div>
                <p>Prophete Werkstatt</p>
                <p>Kundenportal</p>
            </div>
        </div>
    </header>
    <main>
        <div class="main-wrapper">
            <h1>Willkommen zurück.</h1>
            <p>Melden Sie sich an, um Ihre Fahrzeuge und Ihre Kundenkarte zu verwalten.</p>
            <form>
                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email">
                <label for="text">Passwort</label>
                <input type="text" id="text" name="text">
                <a href="#">Passwort vergessen?</a>
                <a class="button" href="./sites/my-bikes.html">Anmelden</a>
            </form>
            <div class="registration-info">
                <p>noch kein Konto?</p>
                <a  href="./sites/registration.html">Jetzt registrieren</a>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-wrapper">
            <p>Im Portal</p>
            <div class="info-box">
                <img src="#" alt="fahrrad-logo">
                <p>Fahrzeug registrieren</p>
            </div>
            <div class="info-box">
                <img src="#" alt="kundenkarte-logo">
                <p>Kundenkarte beantragen</p>
            </div>
            <div class="info-box">
                <img src="#" alt="fahrrad-logo">
                <p>Reparaturstatus (demnächst)</p>
            </div>
        </div>
    </footer>
</body>

</html>
